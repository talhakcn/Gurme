name: gurme
description: "Gurme: mekân keşfetme ve kişisel lezzet defteri."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  # lib/api-spec/openapi.yaml'dan üretilir (lib/api-spec/codegen-dart.sh).
  gurme_client:
    path: ../../lib/api-client-dart
  # 1.2.4, eklendiği gün yayımlanmıştı; 1 gün bekleme kuralı gereği sabitlendi.
  image_picker: 1.2.3
  # Dışa aktarılan yedeği geri yüklemek için dosya seçici (Flutter ekibinin).
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0
  firebase_storage: ^13.6.0
  google_maps_flutter: ^2.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Expo uygulamasında kullanılan kesimler. Lisanslar: assets/fonts/OFL-*.txt
  fonts:
    - family: Bodoni Moda
      fonts:
        - asset: assets/fonts/BodoniModa_400Regular.ttf
        - asset: assets/fonts/BodoniModa_400Regular_Italic.ttf
          style: italic
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_400Regular.ttf
        - asset: assets/fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
