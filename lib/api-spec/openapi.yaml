openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Gurme API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: search
    description: Venue search and AI analysis
  - name: feedback
    description: Anonymous venue feedback and check-ins
  - name: admin
    description: Authorized venue report moderation
  - name: gurme
    description: User-curated food and drink lists
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /autocomplete:
    get:
      operationId: autocompleteLocations
      tags: [search]
      summary: Suggest cities and districts
      description: Google Places Autocomplete; returns at most 5 suggestions. Inputs shorter than 2 characters return an empty list.
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutocompleteResponse"
  /search:
    post:
      operationId: searchVenues
      tags: [search]
      summary: First stage of a venue search
      description: >-
        Runs a single Google Text Search and returns the list immediately.
        Venues that already have an AI insight include it; the ones listed in
        pendingInsights should be requested from /search/insights.
      security:
        - firebaseAuth: []
          appCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Venues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          description: Sign-in or App Check required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Daily free searches used up and the result is not cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceededResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Google Places is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search/insights:
    post:
      operationId: getVenueInsights
      tags: [search]
      summary: Second stage of a venue search
      description: >-
        Returns AI insights for up to 5 venues, analyzing the ones that have
        no stored insight. Venues that turn out not to match the filters are
        listed in excludedPlaceIds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsRequest"
      responses:
        "200":
          description: Venues with insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Google Places is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /places/{placeId}:
    get:
      operationId: getVenue
      tags: [search]
      summary: A single venue with its insight
      description: Used when a venue page is opened outside a search; analyzes the venue if needed.
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 300
      responses:
        "200":
          description: Venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "502":
          description: Google Places is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/quota:
    get:
      operationId: getMyQuota
      tags: [search]
      summary: Today's search quota of the signed-in user
      security:
        - firebaseAuth: []
      responses:
        "200":
          description: Quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaStatus"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Accounts are not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gurme/lists/{id}/claim:
    post:
      operationId: claimGurmeList
      tags: [gurme]
      summary: Attach a list created with a device owner key to the signed-in account
      parameters:
        - $ref: "#/components/parameters/GurmeListId"
      security:
        - firebaseAuth: []
          ownerKeyHeader: []
      responses:
        "200":
          description: List now owned by the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GurmeList"
        "401":
          description: Sign-in and owner key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: List not found or owner key does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gurme/lists/{id}/report:
    post:
      operationId: reportGurmeList
      tags: [gurme]
      summary: Report a shared list for moderator review
      description: One report per account and list; a repeated report updates nothing and still succeeds.
      parameters:
        - $ref: "#/components/parameters/GurmeListId"
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListReportInput"
      responses:
        "202":
          description: Report received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReportReceived"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: List not found or not shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/me:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Whether the caller has administrator rights
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      responses:
        "200":
          description: Administrator status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Users, usage, budgets, lists, open reports and server state
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayload"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Users, most recently seen first
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, blocked, active]
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayload"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: One user's usage, recent searches and lists
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayload"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}/bonus:
    post:
      operationId: grantAdminBonus
      tags: [admin]
      summary: Grant extra searches for today
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBonusInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayload"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}/search:
    post:
      operationId: setUserSearch
      tags: [admin]
      summary: Block or allow a user's searches
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPublishingInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayload"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/searches:
    get:
      operationId: listAdminSearches
      tags: [admin]
      summary: Recent searches and top queries and cities (7 days)
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      parameters:
        - name: outcome
          in: query
          schema:
            type: string
            enum: [ok, cached, quota, budget, blocked, error]
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayload"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/lists:
    get:
      operationId: listAdminLists
      tags: [admin]
      summary: Shared lists for review
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [shared, public, unlisted, hidden, all]
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayload"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/list-reports:
    get:
      operationId: listListReportsForReview
      tags: [admin]
      summary: Reported lists grouped by list, open reports first
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, all]
            default: open
      responses:
        "200":
          description: Reported lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportedList"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/lists/{id}/moderation:
    post:
      operationId: moderateGurmeList
      tags: [admin]
      summary: Hide or restore a list, or dismiss its open reports
      parameters:
        - $ref: "#/components/parameters/GurmeListId"
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListModerationInput"
      responses:
        "200":
          description: Updated list state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportedList"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: List not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}/publishing:
    post:
      operationId: setUserPublishing
      tags: [admin]
      summary: Block or allow a user from publishing lists
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      security:
        - firebaseAuth: []
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPublishingInput"
      responses:
        "200":
          description: Updated publishing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublishingInput"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator rights required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gurme/lists:
    get:
      operationId: listGurmeLists
      tags: [gurme]
      summary: List public lists or lists owned by the bearer key
      description: Without authorization, returns public lists only. With an owner bearer key, returns all lists belonging to that owner.
      security:
        - ownerBearerAuth: []
        - ownerKeyHeader: []
        - firebaseAuth: []
        - {}
      responses:
        "200":
          description: Lists visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GurmeListCollection"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createGurmeList
      tags: [gurme]
      summary: Create a user-curated list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GurmeListInput"
      responses:
        "201":
          description: List created; ownerKey is returned only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GurmeListCreated"
        "400":
          description: Invalid list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: List identifier conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gurme/lists/{id}:
    get:
      operationId: getGurmeList
      tags: [gurme]
      summary: Get a public or unlisted list, or an owned private list
      parameters:
        - $ref: "#/components/parameters/GurmeListId"
      security:
        - ownerBearerAuth: []
        - ownerKeyHeader: []
        - firebaseAuth: []
        - {}
      responses:
        "200":
          description: List details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GurmeList"
        "404":
          description: List not found or not visible to caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateGurmeList
      tags: [gurme]
      summary: Update a list owned by the bearer key
      security:
        - ownerBearerAuth: []
        - ownerKeyHeader: []
        - firebaseAuth: []
      parameters:
        - $ref: "#/components/parameters/GurmeListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GurmeListUpdate"
      responses:
        "200":
          description: List updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GurmeList"
        "400":
          description: Invalid list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Owner bearer key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: List not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGurmeList
      tags: [gurme]
      summary: Delete a list owned by the bearer key
      security:
        - ownerBearerAuth: []
        - ownerKeyHeader: []
        - firebaseAuth: []
      parameters:
        - $ref: "#/components/parameters/GurmeListId"
      responses:
        "204":
          description: List deleted
        "401":
          description: Owner bearer key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: List not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feedback/{installationId}:
    get:
      operationId: getAnonymousFeedback
      tags: [feedback]
      summary: Get feedback belonging to an anonymous app installation
      parameters:
        - $ref: "#/components/parameters/InstallationId"
      responses:
        "200":
          description: Stored reactions and check-ins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousFeedback"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feedback/reaction:
    put:
      operationId: saveVenueReaction
      tags: [feedback]
      summary: Create, update, or remove a venue reaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueReactionInput"
      responses:
        "200":
          description: Reaction state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackWriteResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feedback/checkins:
    post:
      operationId: saveCheckin
      tags: [feedback]
      summary: Save an anonymous venue check-in and note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinInput"
      responses:
        "201":
          description: Check-in saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackWriteResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feedback/reports:
    post:
      operationId: reportVenue
      tags: [feedback]
      summary: Report incorrect information about a venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueReportInput"
      responses:
        "200":
          description: Report accepted or already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueReportResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feedback/admin/reports:
    get:
      operationId: listVenueReportsForReview
      tags: [admin]
      summary: List open venue reports for moderator review
      security:
        - adminBearerAuth: []
      parameters:
        - name: placeId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: reportType
          in: query
          schema:
            $ref: "#/components/schemas/VenueReportType"
      responses:
        "200":
          description: Open reports grouped by venue and report type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueReportReviewQueue"
        "401":
          description: Administrator authorization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Administrator authorization is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feedback/admin/reports/review:
    post:
      operationId: reviewVenueReports
      tags: [admin]
      summary: Accept or reject all open reports for a venue and report type
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueReportReviewInput"
      responses:
        "200":
          description: Reports reviewed and audit history stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueReportReviewResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Administrator authorization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No matching open reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Administrator authorization is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    ownerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Owner key
    ownerKeyHeader:
      type: apiKey
      in: header
      name: X-Owner-Key
      description: List owner key; use this header when Authorization carries a Firebase ID token.
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token (JWT)
      description: >-
        Required for search, feedback and quota endpoints when the server has
        FIREBASE_PROJECT_ID; optional otherwise.
    appCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
  parameters:
    GurmeListId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 100
  schemas:
    HealthStatus:
      type: object
