          maxLength: 120
        description:
          type: string
          maxLength: 2000
        authorName:
          type: string
          minLength: 1
          maxLength: 100
        visibility:
          $ref: "#/components/schemas/GurmeListVisibility"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GurmeListItem"
    GurmeListUpdate:
      type: object
