          type: string
          minLength: 16
          maxLength: 100
        placeId:
          type: string
          minLength: 1
          maxLength: 255
        venueName:
          type: string
          minLength: 1
          maxLength: 255
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 50
        note:
          type: string
          maxLength: 300
        checkedAt:
          type: string
    StoredCheckin:
      allOf:
        - $ref: "#/components/schemas/CheckinInput"
    AnonymousFeedback:
      type: object
      required: [reactions, checkins]
      properties:
        reactions:
