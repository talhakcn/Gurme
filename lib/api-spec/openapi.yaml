      required: [title, description, authorName, visibility, items]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        authorName:
          type: string
          minLength: 1
          maxLength: 100
        visibility:
          $ref: "#/components/schemas/GurmeListVisibility"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GurmeListItem"
    GurmeList:
      type: object
      additionalProperties: false
      required: [id, title, description, authorName, visibility, items, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        authorName:
          type: string
        visibility:
          $ref: "#/components/schemas/GurmeListVisibility"
        items:
          type: array
          items:
            $ref: "#/components/schemas/GurmeListItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GurmeListCreated:
      type: object
      additionalProperties: false
      required: [id, title, description, authorName, visibility, items, createdAt, updatedAt, ownerKey]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        authorName:
          type: string
        visibility:
          $ref: "#/components/schemas/GurmeListVisibility"
        items:
          type: array
          items:
            $ref: "#/components/schemas/GurmeListItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ownerKey:
          type: string
          minLength: 64
          maxLength: 64
          description: Server-generated 32-byte secret, returned once only.
    GurmeListCollection:
      type: array
      items:
        $ref: "#/components/schemas/GurmeList"
    AutocompleteSuggestion:
      type: object
      required: [placeId, description, mainText]
      properties:
        placeId:
          type: string
        description:
          type: string
          description: Full text, e.g. "Kadıköy, İstanbul, Türkiye"
        mainText:
          type: string
          description: Main part, e.g. "Kadıköy"
    AutocompleteResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AutocompleteSuggestion"
    SearchFilters:
      type: object
      additionalProperties: false
      description: >-
        Filter panel. Alcohol uses Google data where available; helal,
        gluten-free and celiac are estimated from reviews and must be shown
        as unverified.
      required: [alcoholFree, helal, glutenFree, celiac]
      properties:
        alcoholFree:
          type: boolean
        helal:
          type: boolean
          description: Implies alcoholFree.
        glutenFree:
          type: boolean
        celiac:
          type: boolean
    SearchRequest:
      type: object
      additionalProperties: false
      required: [city, query]
      properties:
        city:
          type: string
          minLength: 1
          maxLength: 120
          description: City or district text, e.g. "Kadıköy, İstanbul"
        cityPlaceId:
          type: string
          maxLength: 300
          description: Google place_id of the selected autocomplete suggestion
        query:
          type: string
          minLength: 1
          maxLength: 120
          description: What to eat or drink, e.g. "lahmacun"
        filters:
          $ref: "#/components/schemas/SearchFilters"
    InsightsRequest:
      type: object
      additionalProperties: false
      required: [placeIds]
      properties:
        placeIds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 300
        filters:
          $ref: "#/components/schemas/SearchFilters"
    Signal:
      type: string
      enum: ["yes", "no", "unknown"]
    PlaceFeatures:
      type: object
      required: [alcohol, helal, glutenFree, celiacSafe]
      properties:
        alcohol:
          $ref: "#/components/schemas/Signal"
        helal:
          $ref: "#/components/schemas/Signal"
        glutenFree:
          $ref: "#/components/schemas/Signal"
        celiacSafe:
          $ref: "#/components/schemas/Signal"
    FilterStatus:
      type: string
      description: >-
        none: no filter is active. likely: every filter signal is "yes".
        unverified: some signals are unknown.
      enum: [none, likely, unverified]
    PlaceInsight:
      type: object
      required: [summary, whyGo, warnings, vibeTags, highlights, analyzedAt]
      properties:
        summary:
          type: string
        whyGo:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        vibeTags:
          type: array
          items:
            type: string
        highlights:
          type: array
          items:
            type: string
        analyzedAt:
          type: string
          format: date-time
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
    VenueCategory:
      type: string
      enum: [classic, option, discovery]
    Venue:
      type: object
      required: [placeId, name, address, rating, totalRatings, features, filterStatus, insight, needsVerification]
      properties:
        placeId:
          type: string
        name:
          type: string
        address:
          type: string
        rating:
          type: number
        totalRatings:
          type: integer
        location:
          $ref: "#/components/schemas/GeoPoint"
        googleMapsUri:
          type: string
        category:
          $ref: "#/components/schemas/VenueCategory"
        features:
          $ref: "#/components/schemas/PlaceFeatures"
        filterStatus:
          $ref: "#/components/schemas/FilterStatus"
        insight:
          description: null until the venue is analyzed
          oneOf:
            - $ref: "#/components/schemas/PlaceInsight"
            - type: "null"
        needsVerification:
          type: boolean
          description: Flagged by community reports
    SearchResponse:
      type: object
      required: [city, query, filters, venues, limitedResults, categorized, fromCache, pendingInsights]
      properties:
        city:
          type: string
        query:
          type: string
        filters:
          $ref: "#/components/schemas/SearchFilters"
        venues:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        limitedResults:
          type: boolean
          description: Quality threshold was relaxed to show at least 2 venues
        categorized:
          type: boolean
          description: Venues carry classic/option/discovery categories
        fromCache:
          type: boolean
          description: Served from cache; no Google request was made
        pendingInsights:
          type: array
          description: Up to 3 placeIds to request from /search/insights
          items:
            type: string
        quota:
          $ref: "#/components/schemas/QuotaStatus"
    InsightsResponse:
      type: object
      required: [venues, excludedPlaceIds]
      properties:
        venues:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        excludedPlaceIds:
          type: array
          description: Venues that do not match the filters once analyzed
          items:
            type: string
    ReactionType:
      type: string
      enum: [liked, disliked]
    VenueReactionInput:
      type: object
      required: [installationId, placeId, venueName]
      properties:
        installationId:
          type: string
          minLength: 16
          maxLength: 100
        placeId:
          type: string
          minLength: 1
          maxLength: 255
        venueName:
          type: string
          minLength: 1
          maxLength: 255
        reaction:
          oneOf:
            - $ref: "#/components/schemas/ReactionType"
            - type: "null"
    CheckinInput:
      type: object
